<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Data Profiler hero banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"><animate attributeName="stop-color" values="#6366F1;#06B6D4;#A78BFA;#6366F1" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#A78BFA;#6366F1;#06B6D4" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.35"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#263449" stroke-width="0.6" opacity="0.55"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="220" cy="90" r="220" fill="url(#glowA)"><animate attributeName="cy" values="90;130;90" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="980" cy="250" r="240" fill="url(#glowB)"><animate attributeName="cy" values="250;200;250" dur="10s" repeatCount="indefinite"/></circle>
  <!-- mini bar chart motif -->
  <g transform="translate(900,70)" opacity="0.9">
    <rect x="0" y="60" width="26" height="60" rx="5" fill="#6366F1"><animate attributeName="height" values="60;110;60" dur="4s" repeatCount="indefinite"/><animate attributeName="y" values="60;10;60" dur="4s" repeatCount="indefinite"/></rect>
    <rect x="40" y="30" width="26" height="90" rx="5" fill="#06B6D4"><animate attributeName="height" values="90;50;90" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="30;70;30" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="80" y="0" width="26" height="120" rx="5" fill="#A78BFA"><animate attributeName="height" values="120;70;120" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="0;50;0" dur="6s" repeatCount="indefinite"/></rect>
    <rect x="120" y="45" width="26" height="75" rx="5" fill="#10B981"><animate attributeName="height" values="75;115;75" dur="4.5s" repeatCount="indefinite"/><animate attributeName="y" values="45;5;45" dur="4.5s" repeatCount="indefinite"/></rect>
    <line x1="-10" y1="122" x2="160" y2="122" stroke="#263449" stroke-width="2"/>
  </g>
  <text x="70" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="4" fill="#94A3B8">DATA ANALYST PROJECT</text>
  <text x="70" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" fill="url(#accent)">Data Profiler</text>
  <text x="72" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#F8FAFC">Data Preprocessing &amp; Feature Engineering</text>
  <rect x="72" y="204" width="120" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#94A3B8">
    <text x="72" y="254">Acquire from CSV, JSON, SQL and REST sources
      <animate attributeName="opacity" keyTimes="0;0.03;0.30;0.333;1" values="0;1;1;0;0" dur="12s" repeatCount="indefinite"/></text>
    <text x="72" y="254">Understand, clean and explore real customer data
      <animate attributeName="opacity" keyTimes="0;0.333;0.363;0.63;0.666;1" values="0;0;1;1;0;0" dur="12s" repeatCount="indefinite"/></text>
    <text x="72" y="254">Engineer features, work with tensors, profile automatically
      <animate attributeName="opacity" keyTimes="0;0.666;0.696;0.96;1" values="0;0;1;1;0" dur="12s" repeatCount="indefinite"/></text>
  </g>
  <text x="72" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#A78BFA">Python  ·  Pandas  ·  NumPy  ·  Seaborn  ·  Scikit-learn  ·  YData Profiling</text>
</svg>
